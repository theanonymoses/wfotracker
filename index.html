<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quality Team Dashboard</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<!-- Firebase (compat SDK — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper:#FAFAF8;
    --paper-raised:#FFFFFF;
    --ink:#1C1E21;
    --ink-soft:#3F4247;
    --muted:#6B7280;
    --muted-2:#9CA0A8;
    --border:#E4E2DC;
    --border-strong:#D6D3CB;
    --accent:#3D5A80;
    --accent-dark:#2E4664;
    --accent-tint:#EBF0F5;
    --success:#2A7F62;
    --success-tint:#E9F5F0;
    --danger:#B3432E;
    --danger-tint:#FBEEEB;
    --warn:#9C6B1E;
    --warn-tint:#FAF1E0;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:14px;
    --shadow-s:0 1px 2px rgba(28,30,33,0.06);
    --shadow-m:0 4px 16px rgba(28,30,33,0.08);
    --shadow-l:0 12px 40px rgba(28,30,33,0.14);
    --sidebar-w:248px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--accent-tint);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Layout ---------- */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;left:0;bottom:0;
    z-index:40;
    transition:transform .25s ease;
  }
  .sidebar-brand{
    padding:24px 22px 20px 22px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-brand .mark{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.01em;
  }
  .sidebar-brand .sub{
    color:var(--muted);
    font-size:11.5px;
    margin-top:2px;
  }
  .sidebar-nav{padding:14px 12px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:500;
    margin-bottom:2px;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{background:var(--paper);color:var(--ink);}
  .nav-item.active{background:var(--accent-tint);color:var(--accent-dark);}
  .nav-item .ic{width:16px;height:16px;flex-shrink:0;}
  .nav-item .badge{
    margin-left:auto;background:var(--border);color:var(--ink-soft);
    font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;
  }
  .nav-item.active .badge{background:var(--accent);color:#fff;}

  .sidebar-foot{
    border-top:1px solid var(--border);
    padding:14px 16px;
    position:relative;
  }
  .profile-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px;border-radius:var(--radius-s);}
  .profile-row:hover{background:var(--paper);}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;flex-shrink:0;
  }
  .profile-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-role{font-size:11px;color:var(--muted);}
  .profile-menu{
    position:absolute;bottom:64px;left:14px;right:14px;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);
    box-shadow:var(--shadow-l);padding:6px;z-index:50;
  }
  .profile-menu button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:var(--radius-s);font-size:13px;color:var(--ink-soft);
  }
  .profile-menu button:hover{background:var(--paper);color:var(--ink);}

  .main{
    margin-left:var(--sidebar-w);
    flex:1;
    min-width:0;
    display:flex;flex-direction:column;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    background:var(--paper);
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:22px;}
  .topbar .desc{color:var(--muted);font-size:13px;margin-top:3px;}
  .hamburger{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius-s);width:34px;height:34px;align-items:center;justify-content:center;}
  .content{padding:28px 32px 60px 32px;max-width:1180px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:var(--radius-s);
    font-size:13px;font-weight:600;border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .06s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-secondary{background:#fff;color:var(--ink-soft);border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--paper);border-color:var(--muted-2);}
  .btn-danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  .btn-danger:hover{background:var(--danger-tint);}
  .btn-ghost{background:none;color:var(--muted);border-color:transparent;padding:6px 8px;}
  .btn-ghost:hover{background:var(--paper);color:var(--ink);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-icon{width:32px;height:32px;padding:0;align-items:center;justify-content:center;}

  /* ---------- Cards / tables ---------- */
  .card{
    background:var(--paper-raised);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-s);
  }
  .card-pad{padding:20px 22px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .card-head h3{font-size:15px;}
  .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;
    text-transform:none;letter-spacing:0.01em;
    padding:10px 20px;border-bottom:1px solid var(--border);background:var(--paper);
  }
  tbody td{padding:13px 20px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:var(--paper);}
  .table-wrap{overflow-x:auto;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-pending{background:var(--warn-tint);color:var(--warn);}
  .badge-done{background:var(--success-tint);color:var(--success);}
  .badge-admin{background:var(--accent-tint);color:var(--accent-dark);}
  .badge-user{background:var(--border);color:var(--ink-soft);}

  .empty-state{padding:56px 20px;text-align:center;color:var(--muted);}
  .empty-state .glyph{font-size:26px;margin-bottom:10px;opacity:.5;}
  .empty-state .t1{color:var(--ink-soft);font-weight:600;font-size:14px;margin-bottom:4px;}
  .empty-state .t2{font-size:13px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=date],.field input[type=url],.field textarea,.field select{
    width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-s);
    font-size:13.5px;color:var(--ink);background:#fff;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);outline:none;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .field .err{font-size:11.5px;color:var(--danger);margin-top:5px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-chip{
    padding:7px 12px;border:1px solid var(--border-strong);border-radius:20px;font-size:12.5px;font-weight:500;
    color:var(--ink-soft);background:#fff;
  }
  .radio-chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,30,33,0.42);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow-l);
    width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
    animation:modalIn .18s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:16px;}
  .modal-body{padding:22px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}
  .modal.confirm .modal-body{padding:22px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}

  /* ---------- Toasts ---------- */
  .toast-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--radius-s);
    font-size:13px;box-shadow:var(--shadow-l);display:flex;align-items:center;gap:8px;
    animation:toastIn .2s ease;min-width:220px;
  }
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--ink);}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Auth screens ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .auth-card{width:100%;max-width:380px;}
  .auth-brand{text-align:center;margin-bottom:26px;}
  .auth-brand .mark{font-family:'Source Serif 4',serif;font-weight:700;font-size:22px;}
  .auth-brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}
  .auth-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-l);padding:28px;box-shadow:var(--shadow-m);}
  .auth-box h2{font-size:18px;margin-bottom:4px;}
  .auth-box .lead{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .auth-switch button{background:none;border:none;color:var(--accent);font-weight:600;padding:0;}
  .banner{padding:10px 13px;border-radius:var(--radius-s);font-size:12.5px;margin-bottom:16px;line-height:1.5;}
  .banner-err{background:var(--danger-tint);color:var(--danger);}
  .banner-ok{background:var(--success-tint);color:var(--success);}

  /* ---------- Timeline ---------- */
  .tl-date-head{
    display:flex;align-items:baseline;gap:10px;margin:28px 0 14px 0;
  }
  .tl-date-head:first-child{margin-top:4px;}
  .tl-date-head h4{font-size:14px;color:var(--ink);}
  .tl-date-head .line{flex:1;height:1px;background:var(--border);}
  .tl-item{
    display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);
  }
  .tl-item:last-child{border-bottom:none;}
  .tl-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-tint);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .tl-body{flex:1;min-width:0;}
  .tl-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .tl-author{font-weight:600;font-size:13.5px;}
  .tl-time{color:var(--muted);font-size:12px;}
  .tl-text{color:var(--ink-soft);font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .tl-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s ease;}
  .tl-item:hover .tl-actions{opacity:1;}

  /* ---------- Calendar ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
  .cal-dow{background:var(--paper);padding:8px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);}
  .cal-cell{background:#fff;min-height:78px;padding:8px;cursor:pointer;transition:background .12s ease;position:relative;}
  .cal-cell:hover{background:var(--paper);}
  .cal-cell.empty{background:var(--paper);cursor:default;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-cell.selected{background:var(--accent-tint);}
  .cal-daynum{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .cal-count{
    margin-top:6px;display:inline-flex;align-items:center;gap:4px;
    background:var(--accent-tint);color:var(--accent-dark);font-size:11px;font-weight:600;
    padding:2px 7px;border-radius:20px;
  }
  .cal-nav{display:flex;align-items:center;gap:8px;}

  /* ---------- Misc ---------- */
  .toggle-group{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-s);overflow:hidden;}
  .toggle-group button{padding:7px 14px;background:#fff;border:none;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--border-strong);}
  .toggle-group button:last-child{border-right:none;}
  .toggle-group button.on{background:var(--accent);color:#fff;}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
  .search-box input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border-strong);border-radius:var(--radius-s);font-size:13px;}
  .search-box .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);}
  .select-plain{padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-s);font-size:12.5px;background:#fff;color:var(--ink-soft);}
  .link-row-name{font-weight:600;color:var(--ink);}
  .link-row-desc{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .open-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;font-size:12.5px;}
  .open-link:hover{text-decoration:underline;}
  .kicker{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:6px;}
  .stat-num{font-family:'Source Serif 4',serif;font-size:26px;font-weight:600;}
  .stat-label{color:var(--muted);font-size:12px;margin-top:2px;}
  .stat-icon{width:34px;height:34px;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
  .activity-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;}
  .activity-text .who{font-weight:600;}
  .activity-time{color:var(--muted-2);font-size:11.5px;margin-top:1px;}
  .three-dot{position:relative;}
  .dropdown{
    position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-s);
    box-shadow:var(--shadow-m);z-index:30;min-width:140px;padding:5px;
  }
  .dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;font-size:13px;border-radius:5px;color:var(--ink-soft);}
  .dropdown button:hover{background:var(--paper);}
  .dropdown button.danger{color:var(--danger);}
  .checkmark{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;background:#fff;
  }
  .checkmark.done{background:var(--success);border-color:var(--success);}
  .checkmark:hover{border-color:var(--success);}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
  .month-nav{display:flex;align-items:center;gap:12px;}
  .month-nav h3{font-size:16px;min-width:150px;text-align:center;}
  .deadline-group h4{font-size:12.5px;color:var(--muted);font-weight:600;padding:14px 20px 6px 20px;background:var(--paper);}
  .strike{text-decoration:line-through;color:var(--muted-2) !important;}
  .subdued{opacity:0.55;}
  .divider-v{width:1px;background:var(--border);align-self:stretch;}
  .global-search-results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-l);max-height:400px;overflow-y:auto;z-index:60;}
  .gsr-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);}
  .gsr-item:hover{background:var(--paper);}
  .gsr-item:last-child{border-bottom:none;}
  .gsr-title{font-weight:600;font-size:13px;}
  .gsr-type{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .topbar-search{position:relative;width:240px;}

  /* ---------- Responsive ---------- */
  @media (max-width: 980px){
    .grid-cards{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
  @media (max-width: 760px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-l);}
    .main{margin-left:0;}
    .hamburger{display:flex;}
    .topbar{padding:16px 18px;}
    .content{padding:18px 16px 60px 16px;}
    .grid-cards{grid-template-columns:1fr;}
    .topbar-search{display:none;}
    table thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border:1px solid var(--border);border-radius:var(--radius-m);margin-bottom:10px;padding:10px 4px;}
    tbody td{border-bottom:none;padding:6px 12px;}
    tbody td:before{content:attr(data-label);display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:2px;}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const firebaseConfig = {
  apiKey: "AIzaSyCKz9SqPlLO1-S8u_wuBQyOmBteryBpGpY",
  authDomain: "quality-team-dashboard-1e7f9.firebaseapp.com",
  projectId: "quality-team-dashboard-1e7f9",
  storageBucket: "quality-team-dashboard-1e7f9.firebasestorage.app",
  messagingSenderId: "566190883707",

/* =========================================================================
   HELPERS
   ========================================================================= */
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase();
}
function fmtDate(d){
  if(!d) return "";
  const date = d instanceof Date ? d : new Date(d);
  return date.toLocaleDateString(undefined,{ month:"long", day:"numeric", year:"numeric" });
}
function fmtDateShort(d){
  const date = d instanceof Date ? d : new Date(d);
  return date.toLocaleDateString(undefined,{ month:"short", day:"numeric" });
}
function fmtTime(d){
  if(!d) return "";
  const date = d instanceof Date ? d : new Date(d);
  return date.toLocaleTimeString(undefined,{ hour:"numeric", minute:"2-digit" });
}
function toDateInput(d){
  const date = d instanceof Date ? d : new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function tsToDate(ts){
  if(!ts) return null;
  if(ts instanceof Date) return ts;
  if(ts.toDate) return ts.toDate();
  return new Date(ts);
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function isValidEmail(e){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}
function isStrongPassword(p){
  return p && p.length >= 8;
}
function genId(){
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

/* Toast system */
const ToastCtx = React.createContext(null);
function ToastProvider({ children }){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type="ok") => {
    const id = genId();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type === "err" ? "err" : "ok"}`}>
            <Icon name={t.type === "err" ? "x" : "check"} size={14} />
            {t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast(){ return useContextSafe(); }
function useContextSafe(){ return React.useContext(ToastCtx); }

/* Confirm dialog (promise-style via state) */
function useConfirm(){
  const [state, setState] = useState(null); // {title, body, danger, resolve}
  const confirm = useCallback((title, body, danger=true) => {
    return new Promise(resolve => {
      setState({ title, body, danger, resolve });
    });
  }, []);
  const node = state ? (
    <div className="modal-overlay" onClick={() => { state.resolve(false); setState(null); }}>
      <div className="modal confirm" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{state.title}</h3></div>
        <div className="modal-body">{state.body}</div>
        <div className="modal-foot">
          <button className="btn btn-secondary" onClick={() => { state.resolve(false); setState(null); }}>Cancel</button>
          <button className={state.danger ? "btn btn-danger" : "btn btn-primary"} onClick={() => { state.resolve(true); setState(null); }}>
            {state.danger ? "Delete" : "Confirm"}
          </button>
        </div>
      </div>
    </div>
  ) : null;
  return [confirm, node];
}

function AuthScreen(){
  const [mode, setMode] = useState("signin"); // signin | signup | forgot
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [error, setError] = useState("");
  const [okMsg, setOkMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const resetMsgs = () => { setError(""); setOkMsg(""); };

  const handleSignIn = async (e) => {
    e.preventDefault(); resetMsgs();
    if(!isValidEmail(email)){ setError("Enter a valid email address."); return; }
    if(!password){ setError("Enter your password."); return; }
    setBusy(true);
    try{
      await auth.signInWithEmailAndPassword(email, password);
    }catch(err){
      if(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") setError("Incorrect email or password.");
      else if(err.code === "auth/user-not-found") setError("No account found with that email.");
      else if(err.code === "auth/too-many-requests") setError("Too many attempts. Try again in a few minutes.");
      else setError(err.message);
    }
    setBusy(false);
  };

  const handleSignUp = async (e) => {
    e.preventDefault(); resetMsgs();
    if(!fullName.trim()){ setError("Enter your full name."); return; }
    if(!isValidEmail(email)){ setError("Enter a valid email address."); return; }
    if(!isStrongPassword(password)){ setError("Password must be at least 8 characters."); return; }
    if(password !== confirmPassword){ setError("Passwords do not match."); return; }
    setBusy(true);
    try{
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await cred.user.updateProfile({ displayName: fullName.trim() });

      // Determine admin status: first-ever user, or the bootstrap admin email
      const usersSnap = await db.collection("users").limit(1).get();
      const isFirstUser = usersSnap.empty;
      const isBootstrap = email.trim().toLowerCase() === BOOTSTRAP_ADMIN_EMAIL.toLowerCase();
      const role = (isFirstUser || isBootstrap) ? "admin" : "user";

      await db.collection("users").doc(cred.user.uid).set({
        fullName: fullName.trim(),
        email: email.trim(),
        role,
        status: "active",
        createdAt: FieldValue.serverTimestamp(),
      });
    }catch(err){
      if(err.code === "auth/email-already-in-use") setError("An account with this email already exists.");
      else if(err.code === "auth/invalid-email") setError("Enter a valid email address.");
      else if(err.code === "auth/weak-password") setError("Password is too weak. Use at least 8 characters.");
      else setError(err.message);
    }
    setBusy(false);
  };

  const handleForgot = async (e) => {
    e.preventDefault(); resetMsgs();
    if(!isValidEmail(email)){ setError("Enter a valid email address."); return; }
    setBusy(true);
    try{
      await auth.sendPasswordResetEmail(email);
      setOkMsg("Password reset email sent. Check your inbox.");
    }catch(err){
      if(err.code === "auth/user-not-found") setError("No account found with that email.");
      else setError(err.message);
    }
    setBusy(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-brand">
          <div className="mark">Quality Team Dashboard</div>
          <div className="sub">Internal workspace for quality &amp; operations</div>
        </div>
        <div className="auth-box">
          {mode === "signin" && (
            <>
              <h2>Sign in</h2>
              <div className="lead">Welcome back. Enter your details to continue.</div>
              {error && <div className="banner banner-err">{error}</div>}
              {okMsg && <div className="banner banner-ok">{okMsg}</div>}
              <form onSubmit={handleSignIn}>
                <div className="field">
                  <label>Email address</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com" autoComplete="email" />
                </div>
                <div className="field">
                  <label>Password</label>
                  <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
                </div>
                <button type="button" className="btn-ghost" style={{fontSize:12.5,color:"var(--accent)",marginBottom:16,padding:0,background:"none",border:"none",fontWeight:600}} onClick={()=>{setMode("forgot");resetMsgs();}}>Forgot password?</button>
                <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",padding:"10px"}} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
              </form>
              <div className="auth-switch">No account yet? <button onClick={()=>{setMode("signup");resetMsgs();}}>Sign up</button></div>
            </>
          )}
          {mode === "signup" && (
            <>
              <h2>Create your account</h2>
              <div className="lead">Set up access to the team dashboard.</div>
              {error && <div className="banner banner-err">{error}</div>}
              <form onSubmit={handleSignUp}>
                <div className="field">
                  <label>Full name</label>
                  <input type="text" value={fullName} onChange={e=>setFullName(e.target.value)} placeholder="Michael Moses" autoComplete="name" />
                </div>
                <div className="field">
                  <label>Email address</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com" autoComplete="email" />
                </div>
                <div className="field-row">
                  <div className="field">
                    <label>Password</label>
                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 8 characters" autoComplete="new-password" />
                  </div>
                  <div className="field">
                    <label>Confirm password</label>
                    <input type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="Repeat password" autoComplete="new-password" />
                  </div>
                </div>
                <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",padding:"10px",marginTop:4}} disabled={busy}>{busy ? "Creating account…" : "Create account"}</button>
              </form>
              <div className="auth-switch">Already have an account? <button onClick={()=>{setMode("signin");resetMsgs();}}>Sign in</button></div>
            </>
          )}
          {mode === "forgot" && (
            <>
              <h2>Reset your password</h2>
              <div className="lead">We'll email you a link to reset it.</div>
              {error && <div className="banner banner-err">{error}</div>}
              {okMsg && <div className="banner banner-ok">{okMsg}</div>}
              <form onSubmit={handleForgot}>
                <div className="field">
                  <label>Email address</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com" autoComplete="email" />
                </div>
                <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",padding:"10px"}} disabled={busy}>{busy ? "Sending…" : "Send reset link"}</button>
              </form>
              <div className="auth-switch"><button onClick={()=>{setMode("signin");resetMsgs();}}>Back to sign in</button></div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Change password (used inside the app, e.g. from profile menu) */
function ChangePasswordModal({ onClose }){
  const toast = useToast();
  const [currentPw, setCurrentPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if(!isStrongPassword(newPw)){ setError("New password must be at least 8 characters."); return; }
    if(newPw !== confirmPw){ setError("New passwords do not match."); return; }
    setBusy(true);
    try{
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPw);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(newPw);
      toast("Password changed successfully.");
      onClose();
    }catch(err){
      if(err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") setError("Current password is incorrect.");
      else setError(err.message);
    }
    setBusy(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>Change password</h3><button className="btn btn-ghost btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            {error && <div className="banner banner-err">{error}</div>}
            <div className="field">
              <label>Current password</label>
              <input type="password" value={currentPw} onChange={e=>setCurrentPw(e.target.value)} autoComplete="current-password" />
            </div>
            <div className="field">
              <label>New password</label>
              <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} autoComplete="new-password" />
            </div>
            <div className="field">
              <label>Confirm new password</label>
              <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} autoComplete="new-password" />
            </div>
          </div>
          <div className="modal-foot">
            <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : "Change password"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* =========================================================================
   APP DATA CONTEXT — central Firestore subscriptions
   ========================================================================= */
const DataCtx = React.createContext(null);
function useData(){ return React.useContext(DataCtx); }

function DataProvider({ user, profile, children }){
  const [links, setLinks] = useState([]);
  const [updates, setUpdates] = useState([]);
  const [deadlines, setDeadlines] = useState([]);
  const [users, setUsers] = useState([]);
  const [activity, setActivity] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsubs = [];
    let pending = 5;
    const done = () => { pending -= 1; if(pending <= 0) setLoading(false); };

    unsubs.push(db.collection("links").where("deleted","==",false).orderBy("createdAt","desc")
      .onSnapshot(snap => { setLinks(snap.docs.map(d => ({ id:d.id, ...d.data() }))); done(); },
      () => done()));

    unsubs.push(db.collection("scrumUpdates").where("deleted","==",false).orderBy("date","desc").orderBy("createdAt","desc")
      .onSnapshot(snap => { setUpdates(snap.docs.map(d => ({ id:d.id, ...d.data() }))); done(); },
      () => done()));

    unsubs.push(db.collection("deadlines").where("deleted","==",false).orderBy("dueDate","asc")
      .onSnapshot(snap => { setDeadlines(snap.docs.map(d => ({ id:d.id, ...d.data() }))); done(); },
      () => done()));

    unsubs.push(db.collection("users").orderBy("createdAt","asc")
      .onSnapshot(snap => { setUsers(snap.docs.map(d => ({ id:d.id, ...d.data() }))); done(); },
      () => done()));

    unsubs.push(db.collection("activity").orderBy("createdAt","desc").limit(40)
      .onSnapshot(snap => { setActivity(snap.docs.map(d => ({ id:d.id, ...d.data() }))); done(); },
      () => done()));

    return () => unsubs.forEach(u => u && u());
  }, []);

  const logActivity = useCallback(async (text) => {
    try{
      await db.collection("activity").add({
        text,
        userId: user.uid,
        userName: profile?.fullName || user.displayName || "Someone",
        createdAt: FieldValue.serverTimestamp(),
      });
    }catch(e){ /* non-critical */ }
  }, [user, profile]);

  const value = { links, updates, deadlines, users, activity, loading, logActivity };
  return <DataCtx.Provider value={value}>{children}</DataCtx.Provider>;
}

function GlobalSearch(){
  const data = useData();
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const onClick = (e) => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  const results = useMemo(() => {
    if(!q.trim()) return [];
    const t = q.trim().toLowerCase();
    const r = [];
    data.links.forEach(l => { if((l.name||"").toLowerCase().includes(t) || (l.description||"").toLowerCase().includes(t)) r.push({ type:"Link", title:l.name }); });
    data.updates.forEach(u => { if((u.text||"").toLowerCase().includes(t)) r.push({ type:"Scrum Update", title: (u.text||"").slice(0,60) }); });
    data.deadlines.forEach(d => { if((d.title||"").toLowerCase().includes(t)) r.push({ type:"Deadline", title:d.title }); });
    return r.slice(0,8);
  }, [q, data]);

  return (
    <div className="topbar-search" ref={ref}>
      <div className="search-box">
        <span className="ic"><Icon name="search" size={14}/></span>
        <input placeholder="Search everything…" value={q} onChange={e=>{setQ(e.target.value); setOpen(true);}} onFocus={()=>setOpen(true)} />
      </div>
      {open && q.trim() && (
        <div className="global-search-results">
          {results.length === 0 ? (
            <div style={{padding:"14px",color:"var(--muted)",fontSize:13}}>No results for "{q}"</div>
          ) : results.map((r,i) => (
            <div className="gsr-item" key={i}>
              <div className="gsr-title">{r.title}</div>
              <div className="gsr-type">{r.type}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LinkFormModal({ onClose, editing, user, profile }){
  const toast = useToast();
  const data = useData();
  const [name, setName] = useState(editing?.name || "");
  const [description, setDescription] = useState(editing?.description || "");
  const [url, setUrl] = useState(editing?.url || "");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setError("");
    if(!name.trim()){ setError("Enter a resource name."); return; }
    if(!url.trim() || !/^https?:\/\//i.test(url.trim())){ setError("Enter a valid URL starting with http:// or https://"); return; }
    setBusy(true);
    try{
      if(editing){
        await db.collection("links").doc(editing.id).update({
          name: name.trim(), description: description.trim(), url: url.trim(),
          updatedAt: FieldValue.serverTimestamp(), updatedBy: user.uid, updatedByName: profile.fullName,
        });
        toast("Changes saved.");
      }else{
        await db.collection("links").add({
          name: name.trim(), description: description.trim(), url: url.trim(),
          createdBy: user.uid, createdByName: profile.fullName,
          createdAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp(),
          deleted: false,
        });
        data.logActivity("added a new link");
        toast("Link added successfully.");
      }
      onClose();
    }catch(err){ setError(err.message); }
    setBusy(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{editing ? "Edit link" : "Add link"}</h3><button className="btn btn-ghost btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            {error && <div className="banner banner-err">{error}</div>}
            <div className="field">
              <label>Name</label>
              <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Monthly Complaint Tracker" />
            </div>
            <div className="field">
              <label>Description</label>
              <textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Tracker for monitoring and closing customer complaints." />
            </div>
            <div className="field">
              <label>URL</label>
              <input type="url" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://…" />
            </div>
          </div>
          <div className="modal-foot">
            <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : (editing ? "Save changes" : "Add link")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function LinksPage({ user, profile, openAdd, editTarget, setEditTarget }){
  const data = useData();
  const toast = useToast();
  const [confirm, confirmNode] = useConfirm();
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("recent");
  const [menuOpenId, setMenuOpenId] = useState(null);
  const isAdmin = profile.role === "admin";

  const filtered = useMemo(() => {
    let arr = [...data.links];
    if(q.trim()){
      const t = q.trim().toLowerCase();
      arr = arr.filter(l => (l.name||"").toLowerCase().includes(t) || (l.description||"").toLowerCase().includes(t) || (l.createdByName||"").toLowerCase().includes(t));
    }
    switch(sort){
      case "az": arr.sort((a,b)=> (a.name||"").localeCompare(b.name||"")); break;
      case "za": arr.sort((a,b)=> (b.name||"").localeCompare(a.name||"")); break;
      case "oldest": arr.sort((a,b)=> tsToDate(a.createdAt) - tsToDate(b.createdAt)); break;
      case "author": arr.sort((a,b)=> (a.createdByName||"").localeCompare(b.createdByName||"")); break;
      default: arr.sort((a,b)=> tsToDate(b.createdAt) - tsToDate(a.createdAt));
    }
    return arr;
  }, [data.links, q, sort]);

  const canEdit = (l) => isAdmin || l.createdBy === user.uid;

  const handleDelete = async (l) => {
    setMenuOpenId(null);
    const ok = await confirm("Delete this link?", "Are you sure you want to delete this item? This action cannot be undone.");
    if(!ok) return;
    await db.collection("links").doc(l.id).update({ deleted:true, deletedAt: FieldValue.serverTimestamp(), deletedBy: user.uid });
    data.logActivity(`deleted a link ("${l.name}")`);
    toast("Item deleted.");
  };

  return (
    <div>
      {confirmNode}
      {editTarget && <LinkFormModal editing={editTarget} onClose={()=>setEditTarget(null)} user={user} profile={profile} />}
      <div className="toolbar">
        <div className="search-box">
          <span className="ic"><Icon name="search" size={14}/></span>
          <input placeholder="Search resources…" value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <select className="select-plain" value={sort} onChange={e=>setSort(e.target.value)}>
          <option value="recent">Recently added</option>
          <option value="oldest">Oldest first</option>
          <option value="az">Name A–Z</option>
          <option value="za">Name Z–A</option>
          <option value="author">Added by</option>
        </select>
        <div style={{marginLeft:"auto"}}>
          <button className="btn btn-primary" onClick={()=>openAdd("link")}><Icon name="plus" size={14}/> Add Link</button>
        </div>
      </div>

      <div className="card">
        {filtered.length === 0 ? (
          <div className="empty-state"><div className="glyph">◌</div><div className="t1">No shared resources yet</div><div className="t2">Add your first team resource.</div></div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Added by</th><th>Resource</th><th>Description</th><th>Link</th><th></th></tr></thead>
              <tbody>
                {filtered.map(l => (
                  <tr key={l.id}>
                    <td data-label="Added by">
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div className="tl-avatar" style={{width:24,height:24,fontSize:10}}>{initials(l.createdByName)}</div>
                        {l.createdByName}
                      </div>
                    </td>
                    <td data-label="Resource" className="link-row-name">{l.name}</td>
                    <td data-label="Description" style={{color:"var(--muted)"}}>{l.description || "—"}</td>
                    <td data-label="Link"><a className="open-link" href={l.url} target="_blank" rel="noopener noreferrer">Open <Icon name="external" size={12}/></a></td>
                    <td data-label="">
                      {canEdit(l) && (
                        <div className="three-dot">
                          <button className="btn btn-ghost btn-icon" onClick={()=>setMenuOpenId(menuOpenId===l.id?null:l.id)}><Icon name="dots" size={15}/></button>
                          {menuOpenId===l.id && (
                            <div className="dropdown" onMouseLeave={()=>setMenuOpenId(null)}>
                              <button onClick={()=>{setEditTarget(l); setMenuOpenId(null);}}><Icon name="edit" size={13}/> &nbsp;Edit</button>
                              <button className="danger" onClick={()=>handleDelete(l)}><Icon name="trash" size={13}/> &nbsp;Delete</button>
                            </div>
                          )}
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

      const dateObj = new Date(date + "T00:00:00");

        await db.collection("scrumUpdates").doc(editing.id).update({

function UpdatesPage({ user, profile, openAdd, editTarget, setEditTarget }){
  const data = useData();
  const toast = useToast();
  const [confirm, confirmNode] = useConfirm();
  const [view, setView] = useState("timeline");
  const [menuOpenId, setMenuOpenId] = useState(null);
  const [calMonth, setCalMonth] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);
  const isAdmin = profile.role === "admin";
  const canEdit = (u) => isAdmin || u.authorId === user.uid;

  const handleDelete = async (u) => {
    setMenuOpenId(null);
    const ok = await confirm("Delete this update?", "Are you sure you want to delete this item? This action cannot be undone.");
    if(!ok) return;
    await db.collection("scrumUpdates").doc(u.id).update({ deleted:true, deletedAt: FieldValue.serverTimestamp(), deletedBy: user.uid });
    toast("Item deleted.");
  };

  // Group by date for timeline
  const grouped = useMemo(() => {
    const map = new Map();
    data.updates.forEach(u => {
      const d = tsToDate(u.date);
      const key = d ? toDateInput(d) : "unknown";
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(u);
    });
    return Array.from(map.entries()).sort((a,b)=> b[0].localeCompare(a[0]));
  }, [data.updates]);

  // Calendar computations
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const countsByDay = useMemo(() => {
    const m = {};
    data.updates.forEach(u => {
      const d = tsToDate(u.date);
      if(d && d.getFullYear()===year && d.getMonth()===month){
        m[d.getDate()] = (m[d.getDate()]||0) + 1;
      }
    });
    return m;
  }, [data.updates, year, month]);

  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const selectedUpdates = useMemo(() => {
    if(!selectedDate) return [];
    return data.updates.filter(u => { const d = tsToDate(u.date); return d && sameDay(d, selectedDate); });
  }, [selectedDate, data.updates]);

  return (
    <div>
      {confirmNode}
      {editTarget && <UpdateFormModal editing={editTarget} onClose={()=>setEditTarget(null)} user={user} profile={profile} />}
      <div className="toolbar">
        <div className="toggle-group">
          <button className={view==="timeline"?"on":""} onClick={()=>setView("timeline")}>Timeline</button>
          <button className={view==="calendar"?"on":""} onClick={()=>setView("calendar")}>Calendar</button>
        </div>
        <div style={{marginLeft:"auto"}}>
          <button className="btn btn-primary" onClick={()=>openAdd("update")}><Icon name="plus" size={14}/> Add Update</button>
        </div>
      </div>

      {view === "timeline" && (
        <div className="card card-pad">
          {grouped.length === 0 ? (
            <div className="empty-state"><div className="glyph">◌</div><div className="t1">No scrum updates yet</div><div className="t2">Post the first update from today's scrum.</div></div>
          ) : grouped.map(([dateKey, items]) => (
            <div key={dateKey}>
              <div className="tl-date-head">
                <h4>{fmtDate(new Date(dateKey + "T00:00:00"))}</h4>
                <div className="line"></div>
              </div>
              {items.map(u => (
                <div className="tl-item" key={u.id}>
                  <div className="tl-avatar">{initials(u.authorName)}</div>
                  <div className="tl-body">
                    <div className="tl-meta">
                      <span className="tl-author">{u.authorName}</span>
                      <span className="tl-time">{fmtTime(tsToDate(u.createdAt))}</span>
                      {u.updatedAt && u.updatedByName && <span className="tl-time" style={{fontStyle:"italic"}}>· edited</span>}
                    </div>
                    <div className="tl-text">{u.text}</div>
                  </div>
                  {canEdit(u) && (
                    <div className="three-dot tl-actions">
                      <button className="btn btn-ghost btn-icon" onClick={()=>setMenuOpenId(menuOpenId===u.id?null:u.id)}><Icon name="dots" size={15}/></button>
                      {menuOpenId===u.id && (
                        <div className="dropdown" onMouseLeave={()=>setMenuOpenId(null)}>
                          <button onClick={()=>{setEditTarget(u); setMenuOpenId(null);}}><Icon name="edit" size={13}/> &nbsp;Edit</button>
                          <button className="danger" onClick={()=>handleDelete(u)}><Icon name="trash" size={13}/> &nbsp;Delete</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {view === "calendar" && (
        <div className="grid-2">
          <div className="card card-pad">
            <div className="toolbar" style={{marginBottom:16}}>
              <div className="month-nav">
                <button className="btn btn-ghost btn-icon" onClick={()=>setCalMonth(new Date(year, month-1, 1))}><Icon name="chevronL" size={16}/></button>
                <h3>{calMonth.toLocaleDateString(undefined,{month:"long", year:"numeric"})}</h3>
                <button className="btn btn-ghost btn-icon" onClick={()=>setCalMonth(new Date(year, month+1, 1))}><Icon name="chevronR" size={16}/></button>
              </div>
              <button className="btn btn-secondary btn-sm" style={{marginLeft:"auto"}} onClick={()=>{ const now = new Date(); setCalMonth(now); setSelectedDate(now); }}>Today</button>
            </div>
            <div className="cal-grid">
              {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => <div className="cal-dow" key={d}>{d}</div>)}
              {cells.map((d, i) => {
                if(d === null) return <div className="cal-cell empty" key={i}></div>;
                const cellDate = new Date(year, month, d);
                const isToday = sameDay(cellDate, new Date());
                const isSel = selectedDate && sameDay(cellDate, selectedDate);
                const count = countsByDay[d];
                return (
                  <div key={i} className={`cal-cell ${isToday?"today":""} ${isSel?"selected":""}`} onClick={()=>setSelectedDate(cellDate)}>
                    <div className="cal-daynum">{d}</div>
                    {count > 0 && <div className="cal-count"><Icon name="dot" size={7}/>{count}</div>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="card">
            <div className="card-head"><h3>{selectedDate ? fmtDate(selectedDate) : "Select a date"}</h3>{selectedDate && <span className="badge badge-user">{selectedUpdates.length} update{selectedUpdates.length!==1?"s":""}</span>}</div>
            <div style={{padding: selectedUpdates.length ? "6px 20px" : 0}}>
              {!selectedDate ? (
                <div className="empty-state"><div className="glyph">◌</div><div className="t2">Click a date to see updates.</div></div>
              ) : selectedUpdates.length === 0 ? (
                <div className="empty-state"><div className="glyph">◌</div><div className="t1">No scrum updates for this date</div></div>
              ) : selectedUpdates.map(u => (
                <div className="tl-item" key={u.id}>
                  <div className="tl-avatar">{initials(u.authorName)}</div>
                  <div className="tl-body">
                    <div className="tl-meta"><span className="tl-author">{u.authorName}</span><span className="tl-time">{fmtTime(tsToDate(u.createdAt))}</span></div>
                    <div className="tl-text">{u.text}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   DEADLINES PAGE
   ========================================================================= */
function DeadlineFormModal({ onClose, editing, user, profile }){
  const toast = useToast();
  const data = useData();
  const [title, setTitle] = useState(editing?.title || "");
  const [dueDate, setDueDate] = useState(editing ? toDateInput(tsToDate(editing.dueDate)) : toDateInput(new Date()));
  const [repeat, setRepeat] = useState(editing?.repeat || "none");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setError("");
    if(!title.trim()){ setError("Enter a deadline description."); return; }
    if(!dueDate){ setError("Pick a due date."); return; }
    setBusy(true);
    try{
      const dateObj = new Date(dueDate + "T00:00:00");
      if(editing){
        await db.collection("deadlines").doc(editing.id).update({
          title: title.trim(), dueDate: Timestamp.fromDate(dateObj), repeat,
          updatedAt: FieldValue.serverTimestamp(), updatedBy: user.uid, updatedByName: profile.fullName,
        });
        toast("Changes saved.");
      }else{
        await db.collection("deadlines").add({
          title: title.trim(), dueDate: Timestamp.fromDate(dateObj), repeat,
          status: "pending",
          createdBy: user.uid, createdByName: profile.fullName,
          createdAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp(),
          completedBy: null, completedByName: null, completedAt: null,
          deleted: false,
        });
        data.logActivity(`added a deadline ("${title.trim()}")`);
        toast("Deadline added.");
      }
      onClose();
    }catch(err){ setError(err.message); }
    setBusy(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{editing ? "Edit deadline" : "Add deadline"}</h3><button className="btn btn-ghost btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            {error && <div className="banner banner-err">{error}</div>}
            <div className="field">
              <label>Deadline</label>
              <input type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Close all complaints" />
            </div>
            <div className="field">
              <label>Due date</label>
              <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} />
            </div>
            <div className="field">
              <label>Repeat</label>
              <div className="radio-row">
                {[["none","Does not repeat"],["monthly","Monthly"],["weekly","Weekly"],["custom","Custom"]].map(([val,lbl]) => (
                  <div key={val} className={`radio-chip ${repeat===val?"sel":""}`} onClick={()=>setRepeat(val)} role="button">{lbl}</div>
                ))}
              </div>
              <div className="hint">Recurring occurrences are tracked as separate items so history is preserved.</div>
            </div>
          </div>
          <div className="modal-foot">
            <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : (editing ? "Save changes" : "Add deadline")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function DeadlinesPage({ user, profile, openAdd, editTarget, setEditTarget }){
  const data = useData();
  const toast = useToast();
  const [confirm, confirmNode] = useConfirm();
  const [statusFilter, setStatusFilter] = useState("all");
  const [monthOffset, setMonthOffset] = useState(0);
  const [menuOpenId, setMenuOpenId] = useState(null);
  const [q, setQ] = useState("");
  const isAdmin = profile.role === "admin";
  const canEdit = (d) => isAdmin || d.createdBy === user.uid;

  const viewMonth = new Date(); viewMonth.setMonth(viewMonth.getMonth() + monthOffset);
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();

  const filtered = useMemo(() => {
    let arr = data.deadlines.filter(d => {
      const dd = tsToDate(d.dueDate);
      return dd && dd.getFullYear()===y && dd.getMonth()===m;
    });
    if(statusFilter !== "all") arr = arr.filter(d => statusFilter==="completed" ? d.status==="completed" : d.status!=="completed");
    if(q.trim()){
      const t = q.trim().toLowerCase();
      arr = arr.filter(d => (d.title||"").toLowerCase().includes(t) || (d.createdByName||"").toLowerCase().includes(t));
    }
    return arr.sort((a,b)=> tsToDate(a.dueDate) - tsToDate(b.dueDate));
  }, [data.deadlines, y, m, statusFilter, q]);

  const toggleComplete = async (d) => {
    if(d.status === "completed"){
      await db.collection("deadlines").doc(d.id).update({
        status:"pending", completedBy:null, completedByName:null, completedAt:null,
      });
    }else{
      await db.collection("deadlines").doc(d.id).update({
        status:"completed", completedBy:user.uid, completedByName:profile.fullName, completedAt: FieldValue.serverTimestamp(),
      });
      data.logActivity(`completed a deadline ("${d.title}")`);
      toast("Deadline completed.");
    }
  };

  const handleDelete = async (d) => {
    setMenuOpenId(null);
    const ok = await confirm("Delete this deadline?", "Are you sure you want to delete this item? This action cannot be undone.");
    if(!ok) return;
    await db.collection("deadlines").doc(d.id).update({ deleted:true, deletedAt: FieldValue.serverTimestamp(), deletedBy: user.uid });
    toast("Item deleted.");
  };

  return (
    <div>
      {confirmNode}
      {editTarget && <DeadlineFormModal editing={editTarget} onClose={()=>setEditTarget(null)} user={user} profile={profile} />}
      <div className="toolbar">
        <div className="month-nav">
          <button className="btn btn-ghost btn-icon" onClick={()=>setMonthOffset(o=>o-1)}><Icon name="chevronL" size={16}/></button>
          <h3>{viewMonth.toLocaleDateString(undefined,{month:"long", year:"numeric"})}</h3>
          <button className="btn btn-ghost btn-icon" onClick={()=>setMonthOffset(o=>o+1)}><Icon name="chevronR" size={16}/></button>
        </div>
        {monthOffset !== 0 && <button className="btn btn-secondary btn-sm" onClick={()=>setMonthOffset(0)}>This month</button>}
        <div className="toggle-group">
          <button className={statusFilter==="all"?"on":""} onClick={()=>setStatusFilter("all")}>All</button>
          <button className={statusFilter==="pending"?"on":""} onClick={()=>setStatusFilter("pending")}>Pending</button>
          <button className={statusFilter==="completed"?"on":""} onClick={()=>setStatusFilter("completed")}>Completed</button>
        </div>
        <div className="search-box" style={{maxWidth:220}}>
          <span className="ic"><Icon name="search" size={14}/></span>
          <input placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <div style={{marginLeft:"auto"}}>
          <button className="btn btn-primary" onClick={()=>openAdd("deadline")}><Icon name="plus" size={14}/> Add Deadline</button>
        </div>
      </div>

      <div className="card">
        {filtered.length === 0 ? (
          <div className="empty-state"><div className="glyph">◌</div><div className="t1">No deadlines for this month</div><div className="t2">Add a deadline to get started.</div></div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Deadline</th><th>Added by</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {filtered.map(d => {
                  const done = d.status === "completed";
                  return (
                    <tr key={d.id} className={done ? "subdued" : ""}>
                      <td data-label="Date">{fmtDateShort(tsToDate(d.dueDate))}</td>
                      <td data-label="Deadline">
                        <span className={done ? "strike" : ""}>{d.title}</span>
                        {done && d.completedByName && <div className="link-row-desc">Completed by {d.completedByName} · {fmtDate(tsToDate(d.completedAt))} at {fmtTime(tsToDate(d.completedAt))}</div>}
                        {d.repeat && d.repeat !== "none" && <div className="link-row-desc" style={{textTransform:"capitalize"}}>Repeats {d.repeat}</div>}
                      </td>
                      <td data-label="Added by">{d.createdByName}</td>
                      <td data-label="Status">{done ? <span className="badge badge-done"><Icon name="check" size={11}/> Completed</span> : <span className="badge badge-pending">Pending</span>}</td>
                      <td data-label="">
                        <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end"}}>
                          <div className={`checkmark ${done?"done":""}`} onClick={()=>toggleComplete(d)} role="button" title={done?"Mark as pending":"Mark as complete"}>
                            {done && <Icon name="check" size={13} />}
                          </div>
                          {canEdit(d) && (
                            <div className="three-dot">
                              <button className="btn btn-ghost btn-icon" onClick={()=>setMenuOpenId(menuOpenId===d.id?null:d.id)}><Icon name="dots" size={15}/></button>
                              {menuOpenId===d.id && (
                                <div className="dropdown" onMouseLeave={()=>setMenuOpenId(null)}>
                                  <button onClick={()=>{setEditTarget(d); setMenuOpenId(null);}}><Icon name="edit" size={13}/> &nbsp;Edit</button>
                                  <button className="danger" onClick={()=>handleDelete(d)}><Icon name="trash" size={13}/> &nbsp;Delete</button>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   ADMIN PAGE
   ========================================================================= */
function AdminPage({ user, profile }){
  const data = useData();
  const toast = useToast();
  const [confirm, confirmNode] = useConfirm();
  const [tab, setTab] = useState("users");

  const changeRole = async (u, role) => {
    if(u.id === user.uid && role !== "admin"){
      const ok = await confirm("Remove your own admin access?", "You are about to remove admin privileges from your own account. You will lose access to this Admin area.");
      if(!ok) return;
    }
    await db.collection("users").doc(u.id).update({ role });
    toast(`${u.fullName} is now ${role === "admin" ? "an admin" : "a team member"}.`);
  };

  const toggleStatus = async (u) => {
    const newStatus = u.status === "disabled" ? "active" : "disabled";
    const ok = await confirm(
      newStatus === "disabled" ? "Disable this user?" : "Re-enable this user?",
      newStatus === "disabled" ? "They will no longer be able to sign in. Their existing content will remain visible." : "They will be able to sign in again.",
      newStatus === "disabled"
    );
    if(!ok) return;
    await db.collection("users").doc(u.id).update({ status: newStatus });
    toast(`${u.fullName} ${newStatus === "disabled" ? "disabled" : "re-enabled"}.`);
  };

  const removeContent = async (type, item) => {
    const ok = await confirm("Delete this item?", "Are you sure you want to delete this item? This action cannot be undone.");
    if(!ok) return;
    const coll = type === "link" ? "links" : type === "update" ? "scrumUpdates" : "deadlines";
    await db.collection(coll).doc(item.id).update({ deleted:true, deletedAt: FieldValue.serverTimestamp(), deletedBy: user.uid });
    toast("Item deleted.");
  };

  return (
    <div>
      {confirmNode}
      <div className="toolbar">
        <div className="toggle-group">
          <button className={tab==="users"?"on":""} onClick={()=>setTab("users")}>Users</button>
          <button className={tab==="content"?"on":""} onClick={()=>setTab("content")}>Content</button>
          <button className={tab==="activity"?"on":""} onClick={()=>setTab("activity")}>Activity log</button>
        </div>
      </div>

      {tab === "users" && (
        <div className="card">
          <div className="table-wrap">
            <table>
              <thead><tr><th>Full name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead>
              <tbody>
                {data.users.map(u => (
                  <tr key={u.id}>
                    <td data-label="Name">{u.fullName}</td>
                    <td data-label="Email" style={{color:"var(--muted)"}}>{u.email}</td>
                    <td data-label="Role">
                      <select className="select-plain" value={u.role} onChange={e=>changeRole(u, e.target.value)}>
                        <option value="user">Team member</option>
                        <option value="admin">Admin</option>
                      </select>
                    </td>
                    <td data-label="Status">{u.status === "disabled" ? <span className="badge badge-pending">Disabled</span> : <span className="badge badge-done">Active</span>}</td>
                    <td data-label="Joined">{u.createdAt ? fmtDateShort(tsToDate(u.createdAt)) : "—"}</td>
                    <td data-label="">
                      <button className="btn btn-secondary btn-sm" onClick={()=>toggleStatus(u)}>{u.status==="disabled" ? "Re-enable" : "Disable"}</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === "content" && (
        <div>
          <div className="card" style={{marginBottom:16}}>
            <div className="card-head"><h3>Links ({data.links.length})</h3></div>
            <div className="table-wrap">
              <table>
                <tbody>
                  {data.links.map(l => (
                    <tr key={l.id}>
                      <td data-label="Resource" className="link-row-name">{l.name}</td>
                      <td data-label="Added by">{l.createdByName}</td>
                      <td data-label=""><button className="btn btn-danger btn-sm" onClick={()=>removeContent("link", l)}>Delete</button></td>
                    </tr>
                  ))}
                  {data.links.length === 0 && <tr><td style={{color:"var(--muted)"}}>No links yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
          <div className="card" style={{marginBottom:16}}>
            <div className="card-head"><h3>Scrum updates ({data.updates.length})</h3></div>
            <div className="table-wrap">
              <table>
                <tbody>
                  {data.updates.slice(0,20).map(u => (
                    <tr key={u.id}>
                      <td data-label="Update">{(u.text||"").slice(0,70)}{(u.text||"").length>70?"…":""}</td>
                      <td data-label="By">{u.authorName}</td>
                      <td data-label=""><button className="btn btn-danger btn-sm" onClick={()=>removeContent("update", u)}>Delete</button></td>
                    </tr>
                  ))}
                  {data.updates.length === 0 && <tr><td style={{color:"var(--muted)"}}>No updates yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
          <div className="card">
            <div className="card-head"><h3>Deadlines ({data.deadlines.length})</h3></div>
            <div className="table-wrap">
              <table>
                <tbody>
                  {data.deadlines.map(d => (
                    <tr key={d.id}>
                      <td data-label="Deadline">{d.title}</td>
                      <td data-label="By">{d.createdByName}</td>
                      <td data-label=""><button className="btn btn-danger btn-sm" onClick={()=>removeContent("deadline", d)}>Delete</button></td>
                    </tr>
                  ))}
                  {data.deadlines.length === 0 && <tr><td style={{color:"var(--muted)"}}>No deadlines yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {tab === "activity" && (
        <div className="card card-pad">
          {data.activity.length === 0 ? (
            <div className="empty-state"><div className="glyph">◌</div><div className="t1">No activity recorded yet</div></div>
          ) : data.activity.map(a => (
            <div className="activity-row" key={a.id}>
              <div className="activity-dot"></div>
              <div className="activity-text">
                <div><span className="who">{a.userName}</span> {a.text}</div>
                <div className="activity-time">{a.createdAt ? fmtDate(tsToDate(a.createdAt)) + " at " + fmtTime(tsToDate(a.createdAt)) : ""}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   PAGE TITLES
   ========================================================================= */
const PAGE_META = {
  dashboard: { title: "Dashboard", desc: "A quick overview of what the team is working on." },
  links: { title: "Links", desc: "Central directory of shared trackers, documents, and resources." },
  updates: { title: "Scrum Updates", desc: "Chronological record of what's communicated in daily scrum." },
  deadlines: { title: "Deadlines", desc: "Recurring and one-off tasks that need to be completed." },
  admin: { title: "Admin", desc: "Manage users, content, and review recent activity." },
};

/* =========================================================================
   APP SHELL (post-login)
   ========================================================================= */
function AppShell({ user, profile }){
  const [page, setPage] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [addModal, setAddModal] = useState(null); // "link" | "update" | "deadline"
  const [editTarget, setEditTarget] = useState(null);
  const [changePwOpen, setChangePwOpen] = useState(false);

  const openAdd = (type) => setAddModal(type);
  const closeAdd = () => setAddModal(null);

  const meta = PAGE_META[page] || PAGE_META.dashboard;

  return (
    <DataProvider user={user} profile={profile}>
      <div className="app-shell">
        <Sidebar page={page} setPage={setPage} profile={profile} user={user} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} onOpenChangePw={()=>setChangePwOpen(true)} />
        <div className="main">
          <div className="topbar">
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}><Icon name="menu" size={18}/></button>
              <div>
                <h1>{meta.title}</h1>
                <div className="desc">{meta.desc}</div>
              </div>
            </div>
            <GlobalSearch />
          </div>
          <div className="content">
            {page === "dashboard" && <DashboardPage setPage={setPage} openAdd={openAdd} />}
            {page === "links" && <LinksPage user={user} profile={profile} openAdd={openAdd} editTarget={editTarget} setEditTarget={setEditTarget} />}
            {page === "updates" && <UpdatesPage user={user} profile={profile} openAdd={openAdd} editTarget={editTarget} setEditTarget={setEditTarget} />}
            {page === "deadlines" && <DeadlinesPage user={user} profile={profile} openAdd={openAdd} editTarget={editTarget} setEditTarget={setEditTarget} />}
            {page === "admin" && profile.role === "admin" && <AdminPage user={user} profile={profile} />}
          </div>
        </div>
      </div>

      {addModal === "link" && <LinkFormModal onClose={closeAdd} editing={null} user={user} profile={profile} />}
      {addModal === "update" && <UpdateFormModal onClose={closeAdd} editing={null} user={user} profile={profile} />}
      {addModal === "deadline" && <DeadlineFormModal onClose={closeAdd} editing={null} user={user} profile={profile} />}
      {changePwOpen && <ChangePasswordModal onClose={()=>setChangePwOpen(false)} />}
    </DataProvider>
  );
}

/* =========================================================================
   ROOT APP — auth state listener
   ========================================================================= */
function Root(){
  const [authLoading, setAuthLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      setAuthLoading(false);
      if(!u){ setProfile(null); return; }
    });
    return unsub;
  }, []);

  useEffect(() => {
    if(!user){ setProfile(null); return; }
    setProfileLoading(true);
    const unsub = db.collection("users").doc(user.uid).onSnapshot(
      (doc) => {
        if(doc.exists){ setProfile({ id: doc.id, ...doc.data() }); }
        else { setProfile(null); }
        setProfileLoading(false);
      },
      () => setProfileLoading(false)
    );
    return unsub;
  }, [user]);

  if(authLoading) return <div className="loading-screen">Loading…</div>;
  if(!user) return <AuthScreen />;
  if(profileLoading || !profile) return <div className="loading-screen">Setting up your workspace…</div>;

  if(profile.status === "disabled"){
    return (
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-box" style={{textAlign:"center"}}>
            <h2 style={{marginBottom:10}}>Account disabled</h2>
            <div style={{color:"var(--muted)",fontSize:13.5,marginBottom:18}}>Your access has been disabled by an administrator. Contact your team lead if you believe this is a mistake.</div>
            <button className="btn btn-secondary" onClick={()=>auth.signOut()}>Sign out</button>
          </div>
        </div>
      </div>
    );
  }

  return <AppShell user={user} profile={profile} />;
}

function App(){
  return (
    <ToastProvider>
      <Root />
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
